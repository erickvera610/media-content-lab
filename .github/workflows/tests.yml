name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python news_train.py
      - run: python temporal_robustness.py
      - run: python build_demo_data.py
      - run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test_demo.cjs
      - name: Check enhanced browser behavior
        run: node test_enhanced.cjs
      - name: Reproduce case study
        run: python benchmark.py
      - run: node test_news.cjs
      - name: Upload reproducible experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: experiment-evidence-${{ matrix.python }}
          path: |
            artifacts/*.json
            artifacts/experiments.sqlite3
          retention-days: 30
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t media-content-lab .
      - run: docker run -d --name media-content-lab -p 8000:8000 media-content-lab
      - run: sleep 3 && curl --fail http://127.0.0.1:8000/health
      - if: always()
        run: docker rm -f media-content-lab || true
